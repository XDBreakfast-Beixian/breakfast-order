<html lang="zh-TW">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--or:#FF6348;--am:#FF9500;--sa:#E65C00;--sb:#F9A825;--stx:#B34700;--na:#1565C0;--nb:#42A5F5;--ntx:#0D47A1;--gr:#00C9A7;--gd:#008870;--bg:#FFFBF5;--sf:#fff;--tx:#1A1A2E;--mu:#6B7280;--bd:#EDE8E3;--re:#EF4444;--nv:62px;}
html,body{height:100%;overflow:hidden;margin:0;padding:0;background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--tx);}
.wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:600px;margin:0 auto;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.1);}
#pO{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:block;z-index:1;background:var(--bg);padding-bottom:80px;}
#pA{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;z-index:1;background:var(--bg);padding-bottom:80px;}
#pS{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;display:none;flex-direction:column;z-index:1;background:var(--bg);}
#pO.active,#pA.active{display:block;}
#pS.active{display:flex;}
#pS::-webkit-scrollbar{width:4px;}
#pS::-webkit-scrollbar-thumb{background:rgba(255,100,72,.3);border-radius:4px;}
#pS.active{display:flex;}
#pS::-webkit-scrollbar{width:4px;}
#pS::-webkit-scrollbar-thumb{background:rgba(255,100,72,.3);border-radius:4px;}
.sa{flex:1;overflow:hidden;position:relative;}.sa::-webkit-scrollbar{width:3px;}.sa::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px;}
.rUL-filter{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#fff8f5 0%,#fff 100%);}
.rUL-scroll{flex:1;padding-bottom:80px;}
.rUL-scroll::-webkit-scrollbar{width:4px;}
.rUL-scroll::-webkit-scrollbar-track{background:transparent;}
.rUL-scroll::-webkit-scrollbar-thumb{background:rgba(255,100,72,.3);border-radius:4px;}
.nav{height:calc(var(--nv) + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid rgba(255,100,72,.08);display:flex;flex-shrink:0;box-shadow:0 -2px 16px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom);z-index:200;position:relative;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:.6rem;font-weight:600;color:var(--mu);padding:0;}
.nb svg{width:19px;height:19px;}.nb.on{color:var(--or);}
.nink{position:absolute;top:0;height:3px;background:linear-gradient(90deg,var(--or),var(--am));border-radius:0 0 4px 4px;width:33.333%;transition:left .28s cubic-bezier(.4,0,.2,1);}
#sb{flex-shrink:0;padding:8px 13px;background:rgba(255,251,245,.98);border-top:1px solid rgba(255,100,72,.12);display:none;}
#sbb{width:100%;border:none;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,#FF5733,#FF8C00);display:flex;align-items:center;gap:12px;padding:13px 18px;}
@keyframes gl{0%,100%{box-shadow:0 6px 22px rgba(255,87,51,.4);}50%{box-shadow:0 8px 30px rgba(255,87,51,.65),0 0 0 5px rgba(255,87,51,.1);}}
#sbb{animation:gl 2.5s ease-in-out infinite;}
.sico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.stxt{flex:1;text-align:left;}.smain{font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:900;color:#fff;}.ssub{font-size:.67rem;color:rgba(255,255,255,.82);margin-top:2px;}
.sarr{font-size:1.3rem;color:rgba(255,255,255,.65);}
@keyframes f1{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-18px) rotate(7deg);}}
@keyframes f2{0%,100%{transform:translateY(0) rotate(4deg);}50%{transform:translateY(-12px) rotate(-7deg);}}
@keyframes f3{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
@keyframes f4{0%,100%{transform:translateY(0) rotate(6deg);}50%{transform:translateY(-14px) rotate(-5deg);}}
@keyframes f5{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes sRi{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes mFd{from{opacity:0;}to{opacity:1;}}
@keyframes mUp{from{transform:translateY(72px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes spn{to{transform:rotate(360deg);}}
@keyframes cIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

              sm.forEach(function(m){if(k.indexOf(m.name)>0)satItems[m.id]=(satItems[m.id]||0)+v;});
            }
            if(k.indexOf('週日_')===0){
              nm.forEach(function(m){if(k.indexOf(m.name)>0)sunItems[m.id]=(sunItems[m.id]||0)+v;});
            }
          });
        }
        return{
          id:String(row['訂單ID']||''),
          unit:row['單位']||'',area:row['區域']||'',
          name:row['姓名']||'',phone:row['聯絡電話']||'',
          satItems:satItems,sunItems:sunItems,
          timestamp:row['訂購時間']||''
        };
      }).filter(function(o){return o.name&&o.id;});

      if(mapped.length>0){
        /* Safety check: if ALL orders have zero quantities, mapping likely failed */
        var totalQty=0;
        mapped.forEach(function(o){
          Object.values(o.satItems||{}).forEach(function(q){totalQty+=Number(q)||0;});
          Object.values(o.sunItems||{}).forEach(function(q){totalQty+=Number(q)||0;});
        });
        /* Only replace local orders if we got real non-zero data */
        if(totalQty>0||orders.length===0){
          orders=mapped;
          await svSt(OK,orders);
        }
        return true;
      }
    }
  }catch(e){/* fetch failed — local data retained */}
  return false;
}

  var qmEl=document.getElementById('qm_'+day+'_'+id);

  var mcEl=document.getElementById('mc_'+day+'_'+id);

  /* 2d. Recalculate day totals */

  var tq=0,tp=0;
  for(var i=0;i<items.length;i++){var qv=Number(qMap[items[i].id])||0;tq+=qv;tp+=qv*items[i].price;}

  var dhpEl=document.getElementById('dhp_'+day);
  if(dhpEl){dhpEl.textContent=tq+' 份';dhpEl.style.display=tq>0?'':'none';}

  /* 2f. Update day total bar */
  var dtEl=document.getElementById('dt_'+day);
  if(dtEl){
    dtEl.style.display=tq>0?'flex':'none';
    var dtlEl=document.getElementById('dtl_'+day);

function handleImg(input,key,progId,progBarId){
  var file=input.files[0];if(!file)return;
  if(!file.type.match(/image\/(png|jpeg)/)){showAlert('格式不支援','請上傳 PNG、JPG 或 JPEG');input.value='';return;}
  var prog=document.getElementById(progId),bar=document.getElementById(progBarId);
  if(prog)prog.style.display='block';if(bar)bar.style.width='20%';
  var reader=new FileReader();
  reader.onload=function(e){
    if(bar)bar.style.width='50%';
    var img=new Image();
    img.onload=function(){
      /* Compress aggressively: max 400px, JPEG q=0.45 → ~8-15KB → fits GAS cell */
      var MAX=400,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var b64=cv.toDataURL('image/jpeg',0.45);
      if(bar)bar.style.width='80%';
      var sk=key==='H'?IKH:key==='S'?IKS:IKN;
      if(key==='H'){heroB64=b64;heroUrl='';}
      else if(key==='S'){satImgB64=b64;satUrl='';}
      else{sunImgB64=b64;sunUrl='';}
      svSt(sk,b64).then(async function(){
        if(bar)bar.style.width='100%';
        await gasSaveConfig();
        setTimeout(function(){if(prog)prog.style.display='none';if(bar)bar.style.width='0%';input.value='';rOrd();rAdm();},300);
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  var w=document.getElementById('W');if(!w)return;
  var ov=document.createElement('div');ov.style.cssText='position:absolute;inset:0;background:rgba(10,10,20,.5);z-index:800;display:flex;align-items:flex-end;justify-content:center;animation:mFd .2s';
  var bx=document.createElement('div');bx.style.cssText='background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 30px;width:100%';
  var t1=document.createElement('div');t1.style.cssText='font-family:Nunito,sans-serif;font-size:1rem;font-weight:900;text-align:center;margin-bottom:5px';t1.textContent=title;
  var t2=document.createElement('div');t2.style.cssText='font-size:.76rem;color:#6B7280;text-align:center;margin-bottom:18px';t2.textContent=msg;
  var btn=document.createElement('button');btn.style.cssText='width:100%;padding:11px;border:none;border-radius:11px;background:#F3F4F6;font-family:Noto Sans TC,sans-serif;font-weight:700;font-size:.87rem;cursor:pointer';btn.textContent='確定';btn.onclick=function(){ov.remove();};
  bx.appendChild(t1);bx.appendChild(t2);bx.appendChild(btn);ov.appendChild(bx);w.appendChild(ov);
}
</script>
